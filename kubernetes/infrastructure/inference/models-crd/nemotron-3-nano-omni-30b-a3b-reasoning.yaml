apiVersion: inference.eh-ops.io/v1alpha1
kind: InferenceModel
metadata:
  name: nemotron-3-nano-omni-30b-a3b-reasoning
  namespace: inference
spec:
  modelName: nemotron-3-nano-omni-30b-a3b-reasoning
  backend: llamacpp-vulkan-moe
  args:
    - --mmproj
    - $(MMPROJ_SOURCE)
    - --ctx-size
    - "262144"
  source:
    huggingFace:
      repo: unsloth/NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-GGUF
      contextSize: "262144"
      modelFile: NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-UD-Q8_0.gguf
      mmprojFile: mmproj-BF16.gguf
      files:
        - NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-UD-Q8_0.gguf
        - mmproj-BF16.gguf
      tokenSecret: hf-token
  storage:
    pvc: model-cache
    modelDir: nemotron-3-nano-omni-30b-a3b-reasoning
  resources:
    memory: 36Gi
    memoryLimit: 54Gi
  scaling:
    cooldownPeriod: 5m
    maxReplicas: 1
    enabled: true
    evictionPolicy: Default
  nodeSelector:
    kubernetes.io/hostname: shadow
  tolerations:
    - key: amd.com/gpu
      operator: Exists
